<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5cf6">
    <title>StockFlow — Hors ligne</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif; color: #1e1b4b;
            background: radial-gradient(circle at 1px 1px, rgba(124, 58, 237, .16) 1.2px, transparent 0) 0 0 / 24px 24px, linear-gradient(180deg, #f6f3ff, #fdf2f8 55%, #ecfeff);
        }
        .boite { max-width: 440px; padding: 40px 32px; border-radius: 30px; background: rgba(255, 255, 255, .85); box-shadow: 0 40px 80px -30px rgba(76, 29, 149, .5); }
        .logo { width: 84px; border-radius: 24px; animation: flotte 3s ease-in-out infinite; }
        h1 { font-size: 1.9rem; margin: 18px 0 8px; }
        p { color: #64748b; line-height: 1.5; }
        button { margin-top: 24px; border: none; border-radius: 999px; padding: 13px 26px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(120deg, #6366f1, #8b5cf6, #ec4899); }
        @keyframes flotte { 50% { transform: translateY(-10px) rotate(-4deg); } }
    </style>
</head>
<body>
    <div class="boite">
        <svg class="logo" width="84" height="84" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo StockFlow">
  <defs>
    <linearGradient id="sf-fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset=".55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#sf-fond)"/>
  <polygon points="32,9 46,17 32,25 18,17" fill="#FFFFFF"/>
  <polygon points="18,17 32,25 32,41 18,33" fill="#FFFFFF" fill-opacity=".72"/>
  <polygon points="46,17 32,25 32,41 46,33" fill="#FFFFFF" fill-opacity=".45"/>
  <path d="M12 50 q10 -7 20 0 t20 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="51" cy="12" r="3.5" fill="#FDE047"/>
</svg>
        <h1>Pas de réseau 📡</h1>
        <p>StockFlow a besoin d'Internet pour afficher tes stocks à jour. Dès que la connexion revient, on repart.</p>
        <button onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
